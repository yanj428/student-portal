name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Fails the build on high/critical vulnerabilities in dependencies;
      # moderate-and-below are reported but don't block, since those often
      # have no available fix yet and would make CI permanently red.
      - run: npm audit --audit-level=high
