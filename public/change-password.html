<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password | KPIS International School</title>
  <link rel="icon" type="image/png" href="assets/kpis-logo.png" />
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="change-password.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-page">
    <div class="pw-page-card">
      <h1 class="welcome">Change Password</h1>
      <p class="subtitle" id="pw-hint">Choose a new password for your account.</p>

      <form id="pw-form">
        <label class="field-label" for="pw-current">Current password</label>
        <input class="field-input" type="password" id="pw-current" placeholder="Enter your current password" autocomplete="current-password" required />

        <label class="field-label" for="pw-new">New password</label>
        <input class="field-input" type="password" id="pw-new" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required />

        <label class="field-label" for="pw-confirm">Confirm new password</label>
        <input class="field-input" type="password" id="pw-confirm" placeholder="Re-enter your new password" autocomplete="new-password" minlength="8" required />

        <p class="field-error" id="pw-error" hidden></p>
        <p class="field-success" id="pw-success" hidden></p>

        <button type="submit" class="login-btn" id="pw-submit">Save</button>
      </form>

      <p class="signup-line" id="pw-cancel-line" hidden>
        <a href="/">Cancel and go back</a>
      </p>
      <p class="signup-line" id="pw-logout-line" hidden>
        <a href="/login" id="pw-logout-link">Log out</a>
      </p>
    </div>
  </div>

  <script src="change-password.js"></script>
</body>
</html>
